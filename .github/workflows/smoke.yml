name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e-playwright/package-lock.json
      - run: npm ci
        working-directory: e2e-playwright
      - run: npm run lint
        working-directory: e2e-playwright
      - run: npm run typecheck
        working-directory: e2e-playwright
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B spotless:check
        working-directory: api-restassured

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: start juice shop
        run: docker run -d -p 3000:3000 bkimminich/juice-shop:v20.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e-playwright/package-lock.json
      - run: npm ci
        working-directory: e2e-playwright
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e-playwright/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e-playwright
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e-playwright
      - name: wait for juice shop
        run: timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
      - run: npm run test:smoke
        working-directory: e2e-playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-ui-report
          path: |
            e2e-playwright/playwright-report
            e2e-playwright/test-results
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: start juice shop
        run: docker run -d -p 3000:3000 bkimminich/juice-shop:v20.3.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: wait for juice shop
        run: timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
      - run: mvn -B test -Dgroups=smoke
        working-directory: api-restassured
      - name: test summary
        if: always()
        run: |
          echo "### API smoke" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" api-restassured/target/surefire-reports/*.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-api-report
          path: api-restassured/target/surefire-reports
          retention-days: 7
