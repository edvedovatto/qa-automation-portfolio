name: regression

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression
  cancel-in-progress: false

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: start juice shop
        run: docker run -d -p 3000:3000 bkimminich/juice-shop:v20.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e-playwright/package-lock.json
      - run: npm ci
        working-directory: e2e-playwright
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e-playwright/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e-playwright
      - run: npx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e-playwright
      - name: wait for juice shop
        run: timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
      - run: npm test
        working-directory: e2e-playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-ui-report
          path: |
            e2e-playwright/playwright-report
            e2e-playwright/test-results
          retention-days: 14

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: start juice shop
        run: docker run -d -p 3000:3000 bkimminich/juice-shop:v20.3.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: wait for juice shop
        run: timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
      - run: mvn -B test
        working-directory: api-restassured
      - name: test summary
        if: always()
        run: |
          echo "### API regression" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" api-restassured/target/surefire-reports/*.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-api-report
          path: api-restassured/target/surefire-reports
          retention-days: 14
